name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sintaxis de todos los ficheros JS (scripts/lint.mjs)
      - run: npm run lint

      # Checks sueltos: ids, dados, regresiones, matching de imagenes, render
      - run: npm test

      # Build de produccion + service worker
      - run: npm run build

      # E2E en Chrome headless contra el build (scripts/e2e.mjs)
      - name: E2E
        run: |
          npm run preview -- --port 4173 --strictPort &
          node scripts/e2e.mjs
